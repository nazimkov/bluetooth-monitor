name: Build applications

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  portable:
    name: Build portable app
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore app packages
        shell: pwsh
        run: >-
          dotnet restore BluetoothMonitor.App/BluetoothMonitor.App.csproj
          --runtime win-x64
          -p:Platform=x64
          -p:WindowsPackageType=None
          -p:EnableMsixTooling=false
          -p:WindowsAppSDKSelfContained=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxGeneratePriEnabled=false

      - name: Publish self-contained x64 app
        shell: pwsh
        run: >-
          msbuild BluetoothMonitor.App/BluetoothMonitor.App.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:PublishDir=${{ runner.temp }}/BluetoothMonitor/
          -p:WindowsPackageType=None
          -p:EnableMsixTooling=false
          -p:WindowsAppSDKSelfContained=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxGeneratePriEnabled=false

      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path '${{ runner.temp }}/BluetoothMonitor/*' -DestinationPath '${{ runner.temp }}/BluetoothMonitor-win-x64.zip'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothMonitor-win-x64
          path: ${{ runner.temp }}/BluetoothMonitor-win-x64.zip
          if-no-files-found: error

  packaged:
    name: Build packaged MSIX
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore app packages
        shell: pwsh
        run: >-
          dotnet restore BluetoothMonitor.App/BluetoothMonitor.App.csproj
          --runtime win-x64
          -p:Platform=x64

      - name: Write signing certificate
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            throw 'The MSIX_CERTIFICATE_BASE64 secret is not configured.'
          }
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\BluetoothMonitor-signing.pfx",
            [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))

      - name: Validate signing certificate
        shell: pwsh
        env:
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = "$env:RUNNER_TEMP\BluetoothMonitor-signing.pfx"
          if (-not (Test-Path -LiteralPath $pfxPath)) {
            throw "The signing certificate file was not created: $pfxPath"
          }

          try {
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $env:MSIX_CERTIFICATE_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          }
          catch {
            throw "The signing PFX cannot be opened. Check that MSIX_CERTIFICATE_BASE64 contains the PFX and that MSIX_CERTIFICATE_PASSWORD is correct. $($_.Exception.Message)"
          }

          if (-not $certificate.HasPrivateKey) {
            throw 'The signing certificate does not contain a private key. MSIX_CERTIFICATE_BASE64 must contain a PFX, not a CER file.'
          }

          $now = [DateTime]::UtcNow
          if ($now -lt $certificate.NotBefore.ToUniversalTime() -or
              $now -gt $certificate.NotAfter.ToUniversalTime()) {
            throw "The signing certificate is not valid at the current time. Valid from $($certificate.NotBefore.ToUniversalTime().ToString('u')) to $($certificate.NotAfter.ToUniversalTime().ToString('u'))."
          }

          $hasCodeSigningUsage = $false
          foreach ($extension in $certificate.Extensions) {
            if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
              foreach ($usage in $extension.EnhancedKeyUsages) {
                if ($usage.Value -eq '1.3.6.1.5.5.7.3.3') {
                  $hasCodeSigningUsage = $true
                }
              }
            }
          }
          if (-not $hasCodeSigningUsage) {
            throw 'The signing certificate does not have the Code Signing enhanced key usage.'
          }

          [xml]$manifest = Get-Content -LiteralPath 'BluetoothMonitor.App\Package.appxmanifest'
          $identity = $manifest.SelectSingleNode("//*[local-name()='Identity']")
          if ($null -eq $identity) {
            throw 'The package identity was not found in Package.appxmanifest.'
          }

          if ($certificate.Subject -ne $identity.Publisher) {
            throw "The certificate subject '$($certificate.Subject)' does not match the package publisher '$($identity.Publisher)'."
          }

          Write-Host "Signing certificate validated: $($certificate.Subject), expires $($certificate.NotAfter.ToUniversalTime().ToString('u'))."

      - name: Build signed MSIX
        shell: pwsh
        env:
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: >-
          msbuild BluetoothMonitor.App/BluetoothMonitor.App.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsPackageType=MSIX
          /p:EnableMsixTooling=true
          /p:WindowsAppSDKSelfContained=true
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\BluetoothMonitor-signing.pfx"
          /p:PackageCertificatePassword="$env:MSIX_CERTIFICATE_PASSWORD"
          /p:AppxPackageDir="$env:RUNNER_TEMP\AppPackages\"
          /p:AppxBundle=Never

      - name: Collect MSIX package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path "$env:RUNNER_TEMP\AppPackages" -Filter *.msix -Recurse |
            Where-Object { $_.FullName -notmatch '\\AppxTest\\' } |
            Select-Object -First 1
          if ($null -eq $package) {
            throw 'No MSIX package was produced.'
          }
          Copy-Item $package.FullName "$env:RUNNER_TEMP\BluetoothMonitor-win-x64.msix"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothMonitor-win-x64-msix
          path: ${{ runner.temp }}/BluetoothMonitor-win-x64.msix
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [portable, packaged]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BluetoothMonitor-*
          path: release-assets
          merge-multiple: true

      - name: Upload both assets to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
