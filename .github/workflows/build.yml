name: Build applications

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  portable:
    name: Build portable app
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore app packages
        shell: pwsh
        run: >-
          dotnet restore BluetoothMonitor.App/BluetoothMonitor.App.csproj
          --runtime win-x64
          -p:Platform=x64
          -p:WindowsPackageType=None
          -p:EnableMsixTooling=false
          -p:WindowsAppSDKSelfContained=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxGeneratePriEnabled=false

      - name: Publish self-contained x64 app
        shell: pwsh
        run: >-
          msbuild BluetoothMonitor.App/BluetoothMonitor.App.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:PublishDir=${{ runner.temp }}/BluetoothMonitor/
          -p:WindowsPackageType=None
          -p:EnableMsixTooling=false
          -p:WindowsAppSDKSelfContained=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxGeneratePriEnabled=false

      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path '${{ runner.temp }}/BluetoothMonitor/*' -DestinationPath '${{ runner.temp }}/BluetoothMonitor-win-x64.zip'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothMonitor-win-x64
          path: ${{ runner.temp }}/BluetoothMonitor-win-x64.zip
          if-no-files-found: error

  packaged:
    name: Build packaged MSIX
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore app packages
        shell: pwsh
        run: >-
          dotnet restore BluetoothMonitor.App/BluetoothMonitor.App.csproj
          --runtime win-x64
          -p:Platform=x64

      - name: Build unsigned MSIX
        shell: pwsh
        run: >-
          msbuild BluetoothMonitor.App/BluetoothMonitor.App.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsPackageType=MSIX
          /p:EnableMsixTooling=true
          /p:WindowsAppSDKSelfContained=true
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:AppxPackageDir="$env:RUNNER_TEMP\AppPackages\"
          /p:AppxBundle=Never

      - name: Collect MSIX package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path "$env:RUNNER_TEMP\AppPackages" -Filter *.msix -Recurse |
            Where-Object { $_.FullName -notmatch '\\AppxTest\\' } |
            Select-Object -First 1
          if ($null -eq $package) {
            throw 'No unsigned MSIX package was produced.'
          }
          Copy-Item $package.FullName "$env:RUNNER_TEMP\BluetoothMonitor-win-x64.msix"

      - name: Sign MSIX with SignTool
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_CER_BASE64: ${{ secrets.MSIX_CERTIFICATE_CER_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            throw 'The MSIX_CERTIFICATE_BASE64 secret is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_PASSWORD)) {
            throw 'The MSIX_CERTIFICATE_PASSWORD secret is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_CER_BASE64)) {
            throw 'The MSIX_CERTIFICATE_CER_BASE64 secret is not configured.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'BluetoothMonitor-signing.pfx'
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'BluetoothMonitor-signing.cer'
          $msixPath = Join-Path $env:RUNNER_TEMP 'BluetoothMonitor-win-x64.msix'
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
            Write-Host "[sign] MSIX path: $msixPath"
            Write-Host "[sign] MSIX size: $([Math]::Round((Get-Item $msixPath).Length / 1MB, 2)) MB"
            Write-Host '[sign] Decoding PFX secret.'
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
            Write-Host "[sign] PFX written: $([Math]::Round((Get-Item $certificatePath).Length / 1KB, 2)) KB"

            Write-Host '[sign] Decoding the public CER secret.'
            [IO.File]::WriteAllBytes(
              $publicCertificatePath,
              [Convert]::FromBase64String($env:MSIX_CERTIFICATE_CER_BASE64))
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($publicCertificatePath)
            Write-Host "[sign] Certificate thumbprint: $($certificate.Thumbprint)"
            Write-Host "[sign] Certificate preparation took $([Math]::Round($timer.Elapsed.TotalSeconds, 1)) seconds."

            Write-Host '[sign] Searching for SignTool.'
            $signTool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -Last 1
            if ($null -eq $signTool) {
              throw 'SignTool was not found in the Windows SDK.'
            }
            Write-Host "[sign] SignTool: $($signTool.FullName)"
            Write-Host '[sign] Starting signing. The timestamp server can cause a long wait.'

            & $signTool.FullName sign /v /debug /fd SHA256 /a /f $certificatePath `
              /p $env:MSIX_CERTIFICATE_PASSWORD `
              /tr 'http://timestamp.digicert.com' /td SHA256 $msixPath
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool failed with exit code $LASTEXITCODE."
            }
            Write-Host "[sign] Signing completed in $([Math]::Round($timer.Elapsed.TotalSeconds, 1)) seconds."

            $signedMsix = Get-Item -LiteralPath $msixPath -ErrorAction Stop
            if ($signedMsix.Length -le 0) {
              throw 'The signed MSIX is empty.'
            }
            Write-Host "[sign] Signed MSIX size: $([Math]::Round($signedMsix.Length / 1MB, 2)) MB"
            Write-Host '[sign] SignTool completed. Trust verification is skipped for the self-signed certificate.'
          }
          finally {
            Write-Host "[sign] Cleaning temporary certificate files after $([Math]::Round($timer.Elapsed.TotalSeconds, 1)) seconds."
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $publicCertificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare packaged artifact
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'BluetoothMonitor-msix-artifact'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          Copy-Item `
            (Join-Path $env:RUNNER_TEMP 'BluetoothMonitor-win-x64.msix') `
            $artifactDirectory

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothMonitor-win-x64-msix
          path: ${{ runner.temp }}/BluetoothMonitor-msix-artifact
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [portable, packaged]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BluetoothMonitor-*
          path: release-assets
          merge-multiple: true

      - name: Upload both assets to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
